<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>종료 확인</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', '맑은 고딕', sans-serif;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      -webkit-app-region: no-drag;
      user-select: none;
    }

    /* Light dim behind the card */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, 0.28);
      animation: fadeIn 0.18s ease-out;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* White card with a clear dark-green border */
    .dialog-card {
      position: relative;
      z-index: 10;
      width: 392px;
      background: #ffffff;
      border: 2px solid #00873C;
      border-radius: 14px;
      padding: 28px 28px 22px;
      box-shadow: 0 18px 48px rgba(17, 24, 39, 0.28);
      animation: slideUp 0.22s ease-out forwards;
      text-align: center;
    }

    .icon-wrap {
      width: 52px;
      height: 52px;
      margin: 0 auto 14px;
      background: #F3EFFF;
      border: 2px solid #7B61FF;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-wrap svg { width: 28px; height: 28px; }

    .dialog-title {
      font-size: 18px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }

    .dialog-desc {
      font-size: 13.5px;
      color: #374151;
      line-height: 1.55;
      margin-bottom: 20px;
    }

    /* Only shown while a daily plan is on */
    .tray-note {
      display: none;
      background: #F3EFFF;
      border: 1.5px solid #7B61FF;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 16px;
      font-size: 12.5px;
      line-height: 1.5;
      color: #4B3AA8;
      text-align: left;
    }
    body.has-tray .tray-note { display: block; }

    .btn-group { display: flex; gap: 10px; }
    body.has-tray .btn-group { flex-direction: column; }
    body.has-tray .btn-row { display: flex; gap: 10px; }
    body.has-tray .btn-row .btn { flex: 1; }

    .btn {
      flex: 1;
      padding: 12px 0;
      border-radius: 10px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: -0.2px;
      border: 2px solid transparent;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .btn:focus-visible { outline: 3px solid #7B61FF; outline-offset: 2px; }

    /* Main (safe) action: green */
    .btn-primary { background: #00873C; border-color: #00873C; color: #ffffff; }
    .btn-primary:hover { background: #006B30; border-color: #006B30; }

    /* Quit: outlined, red only on hover */
    .btn-quit { background: #ffffff; border-color: #9CA3AF; color: #374151; }
    .btn-quit:hover { background: #FEF2F2; border-color: #DC2626; color: #B91C1C; }

    /* Cancel in tray mode: outlined lavender */
    .btn-cancel-outline { background: #ffffff; border-color: #7B61FF; color: #5B43D6; }
    .btn-cancel-outline:hover { background: #F3EFFF; }

    .key-hint { margin-top: 14px; font-size: 11.5px; color: #6B7280; }
    .key-hint kbd {
      display: inline-block;
      padding: 1px 6px;
      background: #F3F4F6;
      border: 1px solid #9CA3AF;
      border-radius: 4px;
      font-family: inherit;
      font-size: 10.5px;
      color: #374151;
    }
  </style>
</head>
<body>
  <div class="overlay"></div>

  <div class="dialog-card">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 9V13M12 17H12.01M4.982 19H19.018C20.331 19 21.149 17.577 20.492 16.437L13.474 4.225C12.818 3.087 11.182 3.087 10.526 4.225L3.508 16.437C2.851 17.577 3.669 19 4.982 19Z"
          stroke="#7B61FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <div class="dialog-title" id="title">앱을 종료하시겠습니까?</div>
    <div class="dialog-desc" id="desc">
      진행 중인 자동화 작업과 설정된 예약이<br>
      모두 중단됩니다.
    </div>
    <div class="tray-note" id="trayNote">
      매일 자동발행이 켜져 있습니다. <b>트레이에서 계속 실행</b>하면 창을 닫아도 발행이 이어집니다. 트레이 아이콘을 누르면 창이 다시 열립니다.
    </div>

    <!-- Default (no daily plan): [종료] [계속 사용] exactly as before -->
    <div class="btn-group" id="plainButtons">
      <button class="btn btn-quit" id="btnQuit">종료</button>
      <button class="btn btn-primary" id="btnCancel" autofocus>계속 사용</button>
    </div>

    <!-- Daily plan on: tray (default focus) / full quit / cancel -->
    <div class="btn-group" id="trayButtons" hidden>
      <button class="btn btn-primary" id="btnTray">트레이에서 계속 실행</button>
      <div class="btn-row">
        <button class="btn btn-quit" id="btnQuitFull">완전 종료</button>
        <button class="btn btn-cancel-outline" id="btnCancelTray">취소</button>
      </div>
    </div>

    <div class="key-hint"><kbd>Esc</kbd> 취소</div>
  </div>

  <script>
    // contextIsolation: true — preloadDialog.ts의 dialogAPI 사용. 응답은 'tray' | true | false.
    const send = (value) => window.dialogAPI.send('quit-confirm-response', value);
    const hasTray = new URLSearchParams(location.search).get('tray') === '1';

    document.getElementById('btnQuit').addEventListener('click', () => send(true));
    document.getElementById('btnCancel').addEventListener('click', () => send(false));
    document.getElementById('btnQuitFull').addEventListener('click', () => send(true));
    document.getElementById('btnCancelTray').addEventListener('click', () => send(false));
    document.getElementById('btnTray').addEventListener('click', () => send('tray'));

    if (hasTray) {
      document.body.classList.add('has-tray');
      document.getElementById('title').textContent = '창을 닫을까요?';
      document.getElementById('desc').textContent = '창만 닫고 매일 자동발행은 계속 돌릴 수 있습니다.';
      document.getElementById('plainButtons').hidden = true;
      document.getElementById('trayButtons').hidden = false;
      document.getElementById('btnTray').focus();
    }

    // Esc → 취소
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') send(false);
      if (e.key === 'Enter') document.activeElement?.click();
    });
  </script>
</body>
</html>
