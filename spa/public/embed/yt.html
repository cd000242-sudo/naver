<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>영상 보기</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  #player, #player iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  #msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; margin: 0; padding: 16px; color: #fff; font: 16px/1.5 system-ui, 'Malgun Gothic', sans-serif; text-align: center; }
  #msg[hidden] { display: none; }
</style>
</head>
<body>
<div id="player"></div>
<p id="msg" role="alert" hidden></p>
<script>
// Plays one YouTube video inside a frame of the LDB extension (the extension cannot embed YouTube directly: error 153).
// Query: v = 11-character video id (required), t = start second (digits only, optional).
// Only state words go back to the parent window: { source: 'ldb-embed', state, code? }. Nothing is stored or sent anywhere else.
(function () {
  var params = new URLSearchParams(location.search);
  var id = params.get('v') || '';
  var startText = params.get('t') || '';
  var msg = document.getElementById('msg');
  var box = document.getElementById('player');

  function post(state, code) {
    var message = { source: 'ldb-embed', state: state };
    if (Number.isInteger(code)) message.code = code;
    try { if (window.parent && window.parent !== window) window.parent.postMessage(message, '*'); } catch (e) { /* no parent: nothing to tell */ }
  }

  function fail(code) {
    box.hidden = true;
    msg.textContent = '영상을 불러오지 못했어요.' + (Number.isInteger(code) ? ' (오류 ' + code + ')' : '');
    msg.hidden = false;
    post('error', code);
  }

  if (!/^[\w-]{11}$/.test(id)) { fail(); return; }

  window.onYouTubeIframeAPIReady = function () {
    var options = {
      host: 'https://www.youtube-nocookie.com',
      width: '100%',
      height: '100%',
      videoId: id,
      playerVars: { autoplay: 1, playsinline: 1, rel: 0 },
      events: {
        onReady: function () { post('ready'); },
        onStateChange: function (event) {
          var states = window.YT.PlayerState;
          if (event.data === states.PLAYING) post('playing');
          else if (event.data === states.PAUSED) post('paused');
          else if (event.data === states.ENDED) post('ended');
        },
        onError: function (event) { fail(event.data); }
      }
    };
    if (/^\d{1,6}$/.test(startText)) options.playerVars.start = Number(startText);
    new window.YT.Player('player', options);
  };

  var api = document.createElement('script');
  api.src = 'https://www.youtube.com/iframe_api';
  api.onerror = function () { fail(); };
  document.head.appendChild(api);
})();
</script>
</body>
</html>
