name: Deploy Website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'payment-page/**'
      - 'admin/**'
      - 'spa/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (for SPA build)
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: spa/package-lock.json

      - name: Install SPA dependencies
        working-directory: spa
        run: npm ci

      - name: Build SPA (Vite + React)
        working-directory: spa
        run: npm run build

      - name: Verify keyword quality and campaign freshness
        run: node --test scripts/tests/youtube-topic-quality.test.mjs scripts/tests/affiliate-freshness.test.mjs

      - name: Prepare deploy directory
        run: |
          mkdir -p _site
          # 1) Legacy 정적 페이지 복사 (admin + Toss success/fail + 이미지 자산 등)
          cp -r payment-page/* _site/
          # 관리자 패널(admin)은 더 이상 공개 배포하지 않는다 — 마지막 단계에서 _site 에서 제거.
          # 2) SPA dist를 root로 덮어쓰기
          cp -r spa/dist/* _site/
          # 3) GitHub Pages Pretty URL 매칭 차단:
          #    /products → products.html 자동 매칭이 SPA 라우터를 가림.
          #    success.html/fail.html (Toss 콜백) 제외하고 모든 root *.html 을
          #    SPA index 로 교체 → Pretty URL 도 SPA 라우터가 처리.
          find _site -maxdepth 1 -name '*.html' \
            ! -name 'index.html' \
            ! -name '404.html' \
            ! -name 'success.html' \
            ! -name 'fail.html' \
            ! -name 'leword-pro-web.html' \
            -exec cp _site/index.html {} \;
          routes=(products detail leword-detail leword orbit pricing download chatbots reviews community lookup refund privacy terms)
          for page in "${routes[@]}"; do
            if [ -f "_site/${page}/index.html" ]; then
              cp "_site/${page}/index.html" "_site/${page}.html"
            fi
          done
          cp _site/index.html _site/404.html
          # 4) 보안: 관리자 패널을 공개 배포에서 완전히 제외한다.
          #    노출된 옛 토큰 + 관리자 API 표면이 leaderspro.kr/admin.html 로 공개되던 것을 차단.
          #    운영자는 로컬 관리자 패널(바탕화면)을 사용한다. 상위 admin/ 과 payment-page/admin/
          #    양쪽 복사분을 모두 제거한다.
          rm -rf _site/admin _site/admin.html
          # Publish the familiar UI only after the outdated copied panels are
          # removed.  This source has no browser token and no Vultr endpoint.
          cp -r admin _site/admin

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
