name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate version tag
        run: |
          if ! [[ "${REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version tag format. Expected vX.Y.Z"
            exit 1
          fi

        env:
          REF_NAME: ${{ github.ref_name }}

      - name: Verify package.json version matches tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${TAG_NAME#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)"
            echo "Run: npm version $TAG_VERSION --no-git-tag-version"
            exit 1
          fi

      # [2026-09-03 v2.11.219 실측] 여기서 하드코딩된 '이번 업데이트 핵심'(2.11.9x 시절 문구)으로 본문을 덮어써서,
      #   scripts/upload-release.js 가 tmp/release-notes-v<버전>.md 로 붙인 진짜 노트가 7초 뒤 옛 문구로 바뀌었다.
      #   body 를 주지 않으면 softprops 는 기존 본문을 건드리지 않는다 — 노트는 로컬 업로더(또는 gh release edit)가 책임진다.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          generate_release_notes: false
