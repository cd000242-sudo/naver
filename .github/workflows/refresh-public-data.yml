name: Refresh Public Data Snapshots

# 방문자 화면이 API 서버 없이도 살아있게 하는 스냅샷 갱신.
# 서버(관리자 기능용)가 죽어도 홈의 실시간·공지·브리핑·다운로드가 정적본으로 서빙된다.
# spa/** 가 바뀌면 deploy-pages.yml 이 이어서 배포한다.

on:
  schedule:
    # 15분 간격. GitHub 스케줄러는 지연될 수 있으므로 정확한 주기를 보장하지 않는다.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-public-data
  cancel-in-progress: true

jobs:
  refresh:
    name: Collect and commit snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright article collector
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      # 브리프 제목의 두뇌를 API 키가 아니라 **구독**으로 돌리기 위한 준비다.
      # 토큰이 없으면 설치를 건너뛰고 기존 경로(API 키 → 템플릿)로 내려간다.
      #
      # 주의: secrets 는 step 의 `if:` 조건에서 못 쓴다 — 그렇게 썼다가 워크플로
      # 파일 자체가 무효가 되어 잡이 0개인 채 크론이 통째로 죽었다(2026-08-18,
      # 19시대 전 회차 실패 실측). env 로 받아 셸에서 분기한다.
      - name: Install Claude Code (구독 브리프)
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then
            npm install -g @anthropic-ai/claude-code
          else
            echo '구독 토큰 없음 — 설치 건너뜀 (기존 경로로 동작)'
          fi

      - name: Refresh, verify and publish (multi-pass)
        id: commit
        # GitHub 스케줄러는 */15 로 걸어 둬도 실제로는 20~40분씩 밀린다(실측).
        # 그동안 화면의 "실시간"이 40분 전 데이터가 된다.
        # 그래서 한 번 실행될 때 여러 번 갱신·발행한다. 스케줄이 밀려도
        # 공백이 패스 간격(약 4분)까지만 벌어진다.
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY || secrets.BRIGHT_DATA_API_KEY }}
          BRIGHTDATA_WEB_UNLOCKER_ZONE: ${{ vars.BRIGHTDATA_WEB_UNLOCKER_ZONE || vars.BRIGHTDATA_ZONE || secrets.BRIGHTDATA_WEB_UNLOCKER_ZONE || secrets.BRIGHTDATA_ZONE }}
          BRIGHTDATA_FALLBACK_MAX_REQUESTS: ${{ vars.BRIGHTDATA_FALLBACK_MAX_REQUESTS || '0' }}
          # 구독 자격(claude setup-token). 있으면 브리프 제목이 이 경로로 돈다.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          KEYWORD_BRIEF_LLM_API_URL: ${{ vars.KEYWORD_BRIEF_LLM_API_URL }}
          KEYWORD_BRIEF_LLM_API_KEY: ${{ secrets.KEYWORD_BRIEF_LLM_API_KEY }}
          KEYWORD_BRIEF_LLM_MODEL: ${{ vars.KEYWORD_BRIEF_LLM_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          WELFARE_API_KEY: ${{ secrets.WELFARE_API_KEY }}
          NAVER_SEARCHAD_ACCESS_LICENSE: ${{ secrets.NAVER_SEARCHAD_ACCESS_LICENSE }}
          NAVER_SEARCHAD_SECRET_KEY: ${{ secrets.NAVER_SEARCHAD_SECRET_KEY }}
          NAVER_SEARCHAD_CUSTOMER_ID: ${{ secrets.NAVER_SEARCHAD_CUSTOMER_ID }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          PASSES="${REFRESH_PASSES:-3}"
          GAP_SECONDS="${REFRESH_GAP_SECONDS:-240}"
          published=false

          for pass in $(seq 1 "$PASSES"); do
            echo "::group::패스 $pass/$PASSES"
            node scripts/refresh-public-data.mjs || echo "수집 실패 — 이번 패스 건너뜀"
            # 황금보드는 실시간 레인 결과를 후보로 쓰므로 그 뒤에 돈다.
            # 자격증명이 없으면 스스로 건너뛴다(기존 파일 유지).
            node scripts/refresh-golden-briefing.mjs || echo "황금보드 갱신 실패 — 기존 파일 유지"

            # 0건이면 커밋하지 않는다. 좋은 데이터를 빈 데이터로 덮지 않기 위한 마지막 가드.
            for f in spa/public/data/source-signals.json spa/public/data/home-notices.json; do
              if [ -f "$f" ]; then
                node -e "
                  const d = require('./$f');
                  const n = (d.lanes || []).reduce((s, l) => s + (l.items || []).length, 0) + (d.items || []).length;
                  if (n === 0) { console.error('$f 가 0건입니다'); process.exit(1); }
                  console.log('$f: ' + n + '건');
                " || exit 1
              fi
            done

            node scripts/verify-source-signals.mjs --warn-only || true

            if git diff --quiet -- spa/public/data; then
              echo "변경 없음 — 커밋 생략"
            else
              git add spa/public/data
              git commit -m "chore(data): 공개 스냅샷 갱신 $(date -u '+%Y-%m-%d %H:%M UTC')"
              pushed=false
              for attempt in 1 2 3; do
                if git push; then pushed=true; break; fi
                git pull --rebase --autostash origin main || true
              done
              if [ "$pushed" = true ]; then
                published=true
                echo "발행 완료"
              else
                echo "push 3회 실패 — 다음 패스에 재시도"
              fi
            fi
            echo "::endgroup::"

            if [ "$pass" -lt "$PASSES" ]; then sleep "$GAP_SECONDS"; fi
          done

          echo "changed=$published" >> "$GITHUB_OUTPUT"

      - name: Deploy updated snapshots
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
